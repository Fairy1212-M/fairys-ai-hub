<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fairy's AI Learning Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#0f0f23;color:#e0e0e0;line-height:1.7}
.container{max-width:960px;margin:0 auto;padding:24px 20px}
header{text-align:center;padding:40px 0 30px;border-bottom:1px solid #2a2a4a}
header h1{font-size:28px;background:linear-gradient(135deg,#6366f1,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
header p{color:#9ca3af;font-size:14px}
.update-time{text-align:center;padding:16px 0;color:#6b7280;font-size:13px}
.section{margin:28px 0;padding:24px;background:#1a1a2e;border-radius:12px;border:1px solid #2a2a4a}
.section h2{font-size:20px;color:#a78bfa;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #2a2a4a}
.section h3{font-size:16px;color:#60a5fa;margin:16px 0 8px}
.section p,.section li{font-size:14px;color:#d1d5db;margin-bottom:6px}
.section ul{padding-left:20px}
.section a{color:#818cf8;text-decoration:none}
.section a:hover{text-decoration:underline}
.empty-state{text-align:center;padding:80px 20px;color:#6b7280}
.empty-state p{font-size:16px;margin-top:12px}
footer{text-align:center;padding:40px 0 20px;color:#4b5563;font-size:12px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>✨ Fairy's AI Learning Hub</h1>
<p>AI产品情报 · 投放策略研究 · 增长案例拆解 · AI增长探讨</p>
</header>
<div class="update-time">最后更新：2026年9月25日 · 初始部署</div>
<div class="empty-state">
<p>🚀 学习站已成功部署！</p>
<p>每日内容将自动同步到这里，刷新即可查看最新版。</p>
</div>
<footer>
<p>Powered by Fairy · Migoo AI</p>
</footer>
</div>
</body>
</html>
